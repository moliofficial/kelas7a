<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — Kelas 7A</title>
<link rel="stylesheet" href="/style.css">
<style>
/* ── LOGIN ── */
.login-wrap {
  min-height:calc(100vh - 68px); display:flex; align-items:center; justify-content:center; padding:40px 24px;
}
.login-card {
  background:rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.1);
  border-radius:24px; padding:52px 44px; width:100%; max-width:420px; text-align:center;
}
.login-icon { font-size:3rem; margin-bottom:20px; }
.login-card h2 { font-family:'Playfair Display',serif; font-size:1.9rem; font-weight:900; margin-bottom:8px; }
.login-card p { color:var(--gray); margin-bottom:32px; }

/* ── PANEL ── */
.panel-wrap { display:none; padding-top:68px; }
.panel-header {
  background:rgba(10,22,40,0.8); border-bottom:1px solid rgba(255,255,255,0.07);
  padding:0 40px; display:flex; align-items:center; gap:0; height:52px; overflow-x:auto;
}
.tab-btn {
  padding:0 20px; height:52px; background:none; border:none; cursor:pointer;
  font-family:'DM Sans',sans-serif; font-size:0.85rem; font-weight:600; color:var(--gray);
  border-bottom:2.5px solid transparent; white-space:nowrap; transition:.15s;
}
.tab-btn.active { color:var(--gold); border-bottom-color:var(--gold); }
.tab-btn:hover:not(.active) { color:var(--white); }

.panel-body { max-width:1000px; margin:0 auto; padding:48px 40px; }
.panel-logout {
  display:flex; align-items:center; justify-content:space-between;
  margin-bottom:36px; flex-wrap:wrap; gap:14px;
}
.panel-logout h1 { font-family:'Playfair Display',serif; font-size:2rem; font-weight:900; }

.section-card {
  background:rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.08);
  border-radius:var(--radius); padding:32px; margin-bottom:24px;
}
.section-card h3 {
  font-family:'Playfair Display',serif; font-size:1.3rem; margin-bottom:24px;
  display:flex; align-items:center; gap:10px; flex-wrap:wrap;
}

.list-item {
  display:flex; align-items:center; justify-content:space-between;
  background:rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.07);
  border-radius:10px; padding:13px 16px; margin-bottom:10px; gap:10px; flex-wrap:wrap;
}
.list-item .info { flex:1; min-width:0; }
.list-item .nm  { font-weight:700; font-size:0.9rem; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.list-item .sub { font-size:0.75rem; color:var(--gray); margin-top:2px; }
.item-actions { display:flex; gap:7px; flex-shrink:0; }

.status-pill {
  font-size:0.7rem; font-weight:700; padding:4px 10px; border-radius:100px; white-space:nowrap;
}
.s-pending  { background:rgba(251,191,36,.12); color:#fbbf24; }
.s-approved { background:rgba(34,197,94,.12); color:#4ade80; }

.tab-panel { display:none; }
.tab-panel.active { display:block; }

/* scrollable list */
.item-list { max-height:420px; overflow-y:auto; padding-right:4px; }
.item-list::-webkit-scrollbar { width:4px; }
.item-list::-webkit-scrollbar-thumb { background:rgba(255,255,255,.1); border-radius:4px; }

@media(max-width:700px){
  .panel-header { padding:0 12px; }
  .panel-body { padding:32px 20px; }
  .login-card { padding:36px 24px; }
  .section-card { padding:22px; }
}
</style>
</head>
<body>
<nav>
  <a class="nav-brand" href="/">✦ Kelas 7A</a>
  <div class="nav-links">
    <a href="/">Home</a><a href="/siswa">Siswa</a><a href="/foto">Foto</a>
    <a href="/developer">Developer</a><a href="/admin" class="nav-admin">Admin</a>
  </div>
  <button class="nav-hamburger"><span></span><span></span><span></span></button>
</nav>

<!-- LOGIN -->
<div class="login-wrap" id="loginWrap" style="padding-top:68px;">
  <div class="login-card">
    <div class="login-icon">🔐</div>
    <h2>Panel <span style="color:var(--gold)">Admin</span></h2>
    <p>Masukkan password untuk mengakses panel admin kelas 7A</p>
    <div class="form-group" style="text-align:left;">
      <label>Password Admin</label>
      <input type="password" id="passInput" placeholder="••••••••••" onkeydown="if(event.key==='Enter')doLogin()">
    </div>
    <button class="btn btn-primary" style="width:100%;justify-content:center;" onclick="doLogin()">
      Masuk ke Panel →
    </button>
  </div>
</div>

<!-- PANEL -->
<div class="panel-wrap" id="panelWrap">
  <div class="panel-header">
    <button class="tab-btn active" onclick="switchTab('siswa',this)">👥 Siswa</button>
    <button class="tab-btn" onclick="switchTab('foto',this)">📷 Foto</button>
    <button class="tab-btn" onclick="switchTab('developer',this)">💻 Developer</button>
  </div>

  <div class="panel-body">
    <div class="panel-logout">
      <h1>Panel <span style="color:var(--gold)">Admin</span></h1>
      <button class="btn btn-outline" style="padding:10px 22px;font-size:0.85rem;" onclick="doLogout()">Logout</button>
    </div>

    <!-- TAB SISWA -->
    <div class="tab-panel active" id="tp-siswa">
      <div class="section-card">
        <h3>Tambah Siswa <span class="badge">Form</span></h3>
        <div class="form-row">
          <div class="form-group" style="margin:0">
            <label>Nama Lengkap</label>
            <input type="text" id="as-nama" placeholder="Nama siswa">
          </div>
          <div class="form-group" style="margin:0">
            <label>No. Absen</label>
            <input type="number" id="as-absen" placeholder="1">
          </div>
        </div>
        <div class="form-row" style="margin-top:16px;">
          <div class="form-group" style="margin:0">
            <label>NIS</label>
            <input type="text" id="as-nis" placeholder="Nomor Induk Siswa">
          </div>
          <div class="form-group" style="margin:0">
            <label>Jenis Kelamin</label>
            <select id="as-jk"><option value="">– Pilih –</option><option>Laki-laki</option><option>Perempuan</option></select>
          </div>
        </div>
        <button class="btn btn-primary" style="margin-top:20px;" onclick="tambahSiswa()">+ Tambah Siswa</button>
      </div>

      <div class="section-card">
        <h3>Daftar Siswa <span class="badge-count" id="bc-siswa">0</span></h3>
        <div class="item-list" id="list-siswa">
          <div class="loading"><div class="spinner"></div></div>
        </div>
      </div>
    </div>

    <!-- TAB FOTO -->
    <div class="tab-panel" id="tp-foto">
      <div class="section-card">
        <h3>Tambah Foto <span class="badge">Galeri</span></h3>
        <div class="form-group">
          <label>Judul Foto</label>
          <input type="text" id="af-judul" placeholder="Foto Kelas 7A – Olahraga">
        </div>
        <div class="form-group">
          <label>URL Gambar</label>
          <input type="text" id="af-url" placeholder="https://i.imgur.com/...">
        </div>
        <div class="form-row">
          <div class="form-group" style="margin:0">
            <label>Deskripsi</label>
            <input type="text" id="af-desc" placeholder="Keterangan singkat">
          </div>
          <div class="form-group" style="margin:0">
            <label>Tanggal</label>
            <input type="date" id="af-tgl">
          </div>
        </div>
        <button class="btn btn-primary" style="margin-top:20px;" onclick="tambahFoto()">+ Tambah Foto</button>
      </div>
      <div class="section-card">
        <h3>Daftar Foto <span class="badge-count" id="bc-foto">0</span></h3>
        <div class="item-list" id="list-foto"></div>
      </div>
    </div>

    <!-- TAB DEVELOPER -->
    <div class="tab-panel" id="tp-developer">
      <div class="section-card">
        <h3>Tambah Developer <span class="badge">Tim</span></h3>
        <div class="form-row">
          <div class="form-group" style="margin:0">
            <label>Nama</label>
            <input type="text" id="ad-nama" placeholder="Nama developer">
          </div>
          <div class="form-group" style="margin:0">
            <label>Peran / Role</label>
            <input type="text" id="ad-role" placeholder="Ketua Kelas, Web Dev...">
          </div>
        </div>
        <div class="form-group" style="margin-top:16px;">
          <label>Bio Singkat</label>
          <input type="text" id="ad-bio" placeholder="Cerita singkat tentangmu...">
        </div>
        <button class="btn btn-primary" style="margin-top:8px;" onclick="tambahDev()">+ Tambah Developer</button>
      </div>
      <div class="section-card">
        <h3>Tim Developer <span class="badge-count" id="bc-dev">0</span></h3>
        <div class="item-list" id="list-dev"></div>
      </div>
    </div>

  </div><!-- /panel-body -->
</div><!-- /panel-wrap -->

<!-- MODAL EDIT SISWA -->
<div class="modal-overlay" id="editModal">
  <div class="modal">
    <h3>✏️ Edit Data Siswa</h3>
    <input type="hidden" id="em-id">
    <div class="form-group">
      <label>Nama Lengkap</label>
      <input type="text" id="em-nama">
    </div>
    <div class="form-row">
      <div class="form-group" style="margin:0"><label>No. Absen</label><input type="number" id="em-absen"></div>
      <div class="form-group" style="margin:0"><label>NIS</label><input type="text" id="em-nis"></div>
    </div>
    <div class="form-group" style="margin-top:16px;">
      <label>Jenis Kelamin</label>
      <select id="em-jk"><option>Laki-laki</option><option>Perempuan</option></select>
    </div>
    <div class="modal-actions">
      <button class="btn btn-outline" style="padding:10px 18px;font-size:0.85rem;" onclick="closeModal()">Batal</button>
      <button class="btn btn-primary" style="padding:10px 18px;font-size:0.85rem;" onclick="saveEdit()">Simpan</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script type="module">
import { db, ref, set, push, onValue, remove, update, showToast, initNav, ADMIN_PASS } from '/_shared.js';
initNav();

// ── Auth ──────────────────────────────────────────────────────────────────
window.doLogin = function() {
  if (document.getElementById('passInput').value === ADMIN_PASS) {
    document.getElementById('loginWrap').style.display = 'none';
    document.getElementById('panelWrap').style.display = 'block';
    sessionStorage.setItem('admin7a','1');
    showToast('Selamat datang, Admin! ✓');
  } else {
    showToast('Password salah!','error');
    document.getElementById('passInput').value='';
  }
};
window.doLogout = function() {
  sessionStorage.removeItem('admin7a');
  document.getElementById('loginWrap').style.display='flex';
  document.getElementById('panelWrap').style.display='none';
  document.getElementById('passInput').value='';
  showToast('Kamu telah logout');
};
if (sessionStorage.getItem('admin7a') === '1') {
  document.getElementById('loginWrap').style.display='none';
  document.getElementById('panelWrap').style.display='block';
}

// ── Tabs ──────────────────────────────────────────────────────────────────
window.switchTab = function(name, el) {
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
  document.querySelectorAll('.tab-panel').forEach(p=>p.classList.remove('active'));
  el.classList.add('active');
  document.getElementById('tp-'+name).classList.add('active');
};

// ── SISWA ─────────────────────────────────────────────────────────────────
onValue(ref(db,'kelas7a/siswa'), snap => {
  const data = snap.val() || {};
  const entries = Object.entries(data).sort((a,b)=>(a[1].absen||999)-(b[1].absen||999));
  document.getElementById('bc-siswa').textContent = entries.length;

  const list = document.getElementById('list-siswa');
  if (!entries.length) { list.innerHTML='<div class="empty-state"><div class="icon">👤</div><p>Belum ada siswa</p></div>'; return; }
  list.innerHTML = entries.map(([id,s]) => `
    <div class="list-item">
      <div class="info">
        <div class="nm">${s.nama||'?'}</div>
        <div class="sub">Absen ${s.absen||'–'} · NIS ${s.nis||'–'} · ${s.jk||'–'}</div>
      </div>
      <div class="item-actions">
        <button class="btn-sm btn-edit" onclick="openEdit('${id}','${(s.nama||'').replace(/'/g,'\\x27')}',${s.absen||0},'${s.nis||''}','${s.jk||''}')">Edit</button>
        <button class="btn-sm btn-danger" onclick="hapusSiswa('${id}','${(s.nama||'').replace(/'/g,'\\x27')}')">Hapus</button>
      </div>
    </div>`).join('');
});

window.tambahSiswa = async function() {
  const nama  = document.getElementById('as-nama').value.trim();
  const absen = document.getElementById('as-absen').value;
  const nis   = document.getElementById('as-nis').value.trim();
  const jk    = document.getElementById('as-jk').value;
  if (!nama) { showToast('Nama harus diisi!','error'); return; }
  await set(push(ref(db,'kelas7a/siswa')), { nama, absen:Number(absen)||0, nis, jk, createdAt:Date.now() });
  ['as-nama','as-absen','as-nis'].forEach(i=>document.getElementById(i).value='');
  document.getElementById('as-jk').value='';
  showToast(`${nama} berhasil ditambahkan ✓`);
};

window.hapusSiswa = async function(id, nama) {
  if (!confirm(`Hapus siswa "${nama}"?`)) return;
  await remove(ref(db,`kelas7a/siswa/${id}`));
  showToast(`${nama} dihapus`,'error');
};

window.openEdit = function(id,nama,absen,nis,jk) {
  document.getElementById('em-id').value   = id;
  document.getElementById('em-nama').value  = nama;
  document.getElementById('em-absen').value = absen;
  document.getElementById('em-nis').value   = nis;
  document.getElementById('em-jk').value    = jk;
  document.getElementById('editModal').classList.add('open');
};
window.closeModal = () => document.getElementById('editModal').classList.remove('open');
window.saveEdit = async function() {
  const id = document.getElementById('em-id').value;
  const nama  = document.getElementById('em-nama').value.trim();
  const absen = document.getElementById('em-absen').value;
  const nis   = document.getElementById('em-nis').value.trim();
  const jk    = document.getElementById('em-jk').value;
  await update(ref(db,`kelas7a/siswa/${id}`), { nama, absen:Number(absen)||0, nis, jk });
  closeModal();
  showToast('Data siswa diperbarui ✓');
};
document.getElementById('editModal').addEventListener('click', e => { if(e.target.id==='editModal') closeModal(); });

// ── FOTO ──────────────────────────────────────────────────────────────────
onValue(ref(db,'kelas7a/foto'), snap => {
  const data = snap.val() || {};
  const entries = Object.entries(data).sort((a,b)=>b[1].createdAt-a[1].createdAt);
  document.getElementById('bc-foto').textContent = entries.length;
  const list = document.getElementById('list-foto');
  if (!entries.length) { list.innerHTML='<div class="empty-state"><div class="icon">📷</div><p>Belum ada foto</p></div>'; return; }
  list.innerHTML = entries.map(([id,f]) => `
    <div class="list-item">
      <div class="info">
        <div class="nm">${f.judul||'Tanpa Judul'}</div>
        <div class="sub">${f.tgl||''} ${f.desc?'· '+f.desc:''}</div>
      </div>
      <button class="btn-sm btn-danger" onclick="hapusFoto('${id}')">Hapus</button>
    </div>`).join('');
});

window.tambahFoto = async function() {
  const judul = document.getElementById('af-judul').value.trim();
  const url   = document.getElementById('af-url').value.trim();
  const desc  = document.getElementById('af-desc').value.trim();
  const tgl   = document.getElementById('af-tgl').value;
  if (!judul) { showToast('Judul harus diisi!','error'); return; }
  await set(push(ref(db,'kelas7a/foto')), { judul,url,desc,tgl,createdAt:Date.now() });
  ['af-judul','af-url','af-desc','af-tgl'].forEach(i=>document.getElementById(i).value='');
  showToast('Foto ditambahkan ✓');
};
window.hapusFoto = async function(id) {
  if (!confirm('Hapus foto ini?')) return;
  await remove(ref(db,`kelas7a/foto/${id}`));
  showToast('Foto dihapus','error');
};

// ── DEVELOPER ─────────────────────────────────────────────────────────────
onValue(ref(db,'kelas7a/developer'), snap => {
  const data = snap.val() || {};
  const entries = Object.entries(data).sort((a,b)=>(a[1].createdAt||0)-(b[1].createdAt||0));
  document.getElementById('bc-dev').textContent = entries.length;
  const list = document.getElementById('list-dev');
  if (!entries.length) { list.innerHTML='<div class="empty-state"><div class="icon">💻</div><p>Belum ada developer</p></div>'; return; }
  list.innerHTML = entries.map(([id,d]) => `
    <div class="list-item">
      <div class="info">
        <div class="nm">${d.nama||'?'}</div>
        <div class="sub">${d.role||''} ${d.bio?'· '+d.bio:''}</div>
      </div>
      <button class="btn-sm btn-danger" onclick="hapusDev('${id}')">Hapus</button>
    </div>`).join('');
});

window.tambahDev = async function() {
  const nama = document.getElementById('ad-nama').value.trim();
  const role = document.getElementById('ad-role').value.trim();
  const bio  = document.getElementById('ad-bio').value.trim();
  if (!nama) { showToast('Nama harus diisi!','error'); return; }
  await set(push(ref(db,'kelas7a/developer')), { nama,role,bio,createdAt:Date.now() });
  ['ad-nama','ad-role','ad-bio'].forEach(i=>document.getElementById(i).value='');
  showToast('Developer ditambahkan ✓');
};
window.hapusDev = async function(id) {
  if (!confirm('Hapus developer ini?')) return;
  await remove(ref(db,`kelas7a/developer/${id}`));
  showToast('Developer dihapus','error');
};
</script>
</body>
</html>
