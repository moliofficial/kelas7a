<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Galeri Foto — Kelas 7A</title>
<link rel="stylesheet" href="/style.css">
<style>
.page-hero { padding:80px 40px 60px; max-width:1140px; margin:0 auto; }
.foto-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:22px; }
.foto-card {
  background:rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.08);
  border-radius:var(--radius); overflow:hidden; transition:all .2s; cursor:pointer;
}
.foto-card:hover { transform:translateY(-5px); border-color:rgba(245,200,66,.3); box-shadow:0 16px 40px rgba(0,0,0,.35); }
.foto-img { width:100%; aspect-ratio:4/3; object-fit:cover; display:block; }
.foto-noimg {
  width:100%; aspect-ratio:4/3;
  background:linear-gradient(135deg,rgba(26,58,107,.7),rgba(10,22,40,.9));
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:12px;
}
.foto-noimg svg { opacity:.25; }
.foto-noimg span { color:var(--gray); font-size:0.8rem; }
.foto-body { padding:20px 22px; }
.foto-title { font-weight:700; font-size:1rem; margin-bottom:5px; line-height:1.4; }
.foto-date  { font-size:0.75rem; color:var(--gold); font-weight:600; }
.foto-desc  { font-size:0.82rem; color:var(--gray); margin-top:7px; line-height:1.6; }
#lightbox {
  display:none; position:fixed; inset:0; background:rgba(0,0,0,.92); z-index:9997;
  align-items:center; justify-content:center; padding:20px; backdrop-filter:blur(6px);
}
#lightbox.open { display:flex; }
#lightbox img { max-width:90vw; max-height:85vh; border-radius:12px; object-fit:contain; }
.lb-close {
  position:absolute; top:20px; right:24px; font-size:2rem; color:var(--white);
  cursor:pointer; background:none; border:none; line-height:1; opacity:.7;
}
.lb-close:hover { opacity:1; }
@media(max-width:700px){ .page-hero { padding:60px 20px 40px; } }
</style>
</head>
<body>
<nav>
  <a class="nav-brand" href="/">✦ Kelas 7A</a>
  <div class="nav-links">
    <a href="/">Home</a><a href="/siswa">Siswa</a><a href="/foto">Foto</a>
    <a href="/anime">Anime</a>
    <a href="/developer">Developer</a><a href="/anime">🎬 Anime</a><a href="/admin" class="nav-admin">Admin</a>
  </div>
  <button class="nav-hamburger"><span></span><span></span><span></span></button>
</nav>

<div class="page-wrapper">
  <div class="page-hero">
    <p style="color:var(--gold);font-size:.75rem;font-weight:700;text-transform:uppercase;letter-spacing:2px;margin-bottom:10px;">Kelas 7A · Dokumentasi</p>
    <h1 style="font-family:'Playfair Display',serif;font-size:clamp(1.8rem,5vw,2.8rem);font-weight:900;margin-bottom:10px;">Galeri <span style="color:var(--gold)">Foto</span></h1>
    <p style="color:var(--gray);">Momen dan kegiatan kelas 7A yang terdokumentasi</p>
  </div>
  <div class="section" style="padding-top:0;">
    <div class="foto-grid" id="fotoGrid">
      <div class="loading" style="grid-column:1/-1"><div class="spinner"></div>Memuat galeri...</div>
    </div>
  </div>
</div>

<div id="lightbox">
  <button class="lb-close" onclick="closeLb()">✕</button>
  <img id="lbImg" src="" alt="">
</div>
<div id="toast"></div>

<script type="module">
import { db, ref, onValue, initNav } from '/_shared.js';
initNav();

onValue(ref(db,'kelas7a/foto'), snap => {
  const data = snap.val() || {};
  const grid = document.getElementById('fotoGrid');
  const entries = Object.entries(data).sort((a,b)=>b[1].createdAt-a[1].createdAt);

  if (!entries.length) {
    grid.innerHTML='<div class="empty-state" style="grid-column:1/-1"><div class="icon">📷</div><p>Belum ada foto ditambahkan</p></div>';
    return;
  }

  grid.innerHTML = entries.map(([id,f]) => {
    const hasImg = f.url && f.url.trim();
    return `<div class="foto-card" onclick="${hasImg?`openLb('${f.url}')`:''}" style="${hasImg?'':'cursor:default'}">
      ${hasImg
        ? `<img class="foto-img" src="${f.url}" alt="${f.judul||''}" onerror="this.style.display='none';this.nextSibling.style.display='flex'">`
        : ''
      }
      <div class="foto-noimg" style="display:${hasImg?'none':'flex'}">
        <svg width="52" height="52" fill="none" stroke="currentColor" stroke-width="1.2" viewBox="0 0 24 24">
          <rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/>
          <polyline points="21 15 16 10 5 21"/>
        </svg>
        <span>Foto tidak tersedia</span>
      </div>
      <div class="foto-body">
        <div class="foto-title">${f.judul||'Tanpa Judul'}</div>
        <div class="foto-date">${f.tgl||''}</div>
        <div class="foto-desc">${f.desc||''}</div>
      </div>
    </div>`;
  }).join('');
});

window.openLb = url => {
  document.getElementById('lbImg').src = url;
  document.getElementById('lightbox').classList.add('open');
};
window.closeLb = () => document.getElementById('lightbox').classList.remove('open');
document.getElementById('lightbox').addEventListener('click', e => { if(e.target.id==='lightbox') closeLb(); });
</script>
</body>
</html>
