<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daftar Siswa — Kelas 7A</title>
<link rel="stylesheet" href="/style.css">
<style>
.page-header {
  padding: 72px 40px 0;
  max-width:1140px; margin:0 auto;
  display:flex; align-items:flex-end; justify-content:space-between; flex-wrap:wrap; gap:20px;
}
.search-bar {
  display:flex; align-items:center; gap:10px;
  background:rgba(255,255,255,0.06); border:1.5px solid rgba(255,255,255,0.1);
  border-radius:12px; padding:10px 16px; transition:border .2s;
}
.search-bar:focus-within { border-color:var(--gold); }
.search-bar svg { opacity:.4; flex-shrink:0; }
.search-bar input {
  background:none; border:none; outline:none; color:var(--white);
  font-family:'DM Sans',sans-serif; font-size:0.9rem; width:220px;
}
.search-bar input::placeholder { color:var(--gray); }

.filter-row { display:flex; gap:8px; flex-wrap:wrap; margin-top:20px; }
.chip {
  padding:7px 16px; border-radius:100px; font-size:0.78rem; font-weight:700;
  cursor:pointer; border:1.5px solid rgba(255,255,255,0.1); color:var(--gray);
  background:transparent; transition:.15s; font-family:'DM Sans',sans-serif;
}
.chip.active { background:rgba(245,200,66,0.12); border-color:rgba(245,200,66,.4); color:var(--gold); }

.siswa-grid {
  display:grid; grid-template-columns:repeat(auto-fill, minmax(195px,1fr)); gap:18px;
}
.s-card {
  background:rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.08);
  border-radius:var(--radius); padding:26px 20px; text-align:center;
  transition:all .2s; position:relative; overflow:hidden;
}
.s-card::before {
  content:''; position:absolute; top:0; left:0; right:0; height:3px;
  background:linear-gradient(90deg,var(--gold),var(--gold2)); transform:scaleX(0); transition:.2s;
}
.s-card:hover { transform:translateY(-5px); border-color:rgba(245,200,66,.28); box-shadow:0 12px 32px rgba(0,0,0,.3); }
.s-card:hover::before { transform:scaleX(1); }
.s-avatar {
  width:72px; height:72px; border-radius:50%; margin:0 auto 16px;
  display:flex; align-items:center; justify-content:center;
  font-family:'Playfair Display',serif; font-size:1.5rem; font-weight:900; color:var(--navy);
  overflow:hidden; border:3px solid rgba(255,255,255,0.1);
}
.s-avatar img { width:100%; height:100%; object-fit:cover; }
.s-avatar.lk { background:linear-gradient(135deg,#3b82f6,#1d4ed8); }
.s-avatar.pr { background:linear-gradient(135deg,var(--gold),var(--gold2)); }
.s-name  { font-weight:700; font-size:0.95rem; margin-bottom:5px; line-height:1.3; }
.s-absen { font-size:0.75rem; color:var(--gold); font-weight:600; }
.s-nis   { font-size:0.72rem; color:var(--gray); margin-top:3px; }
.s-jk    { font-size:0.72rem; color:var(--gray); margin-top:2px; }

.count-text { color:var(--gray); font-size:0.85rem; }

@media(max-width:700px){
  .page-header { padding:56px 20px 0; }
  .search-bar input { width:150px; }
  .filter-row { margin-top:14px; }
}
</style>
</head>
<body>

<nav>
  <a class="nav-brand" href="/">✦ Kelas 7A</a>
  <div class="nav-links">
    <a href="/">Home</a><a href="/siswa">Siswa</a><a href="/foto">Foto</a>
    <a href="/anime">Anime</a>
    <a href="/developer">Developer</a><a href="/anime">🎬 Anime</a><a href="/admin" class="nav-admin">Admin</a>
  </div>
  <button class="nav-hamburger"><span></span><span></span><span></span></button>
</nav>

<div class="page-wrapper">

  <div class="page-header">
    <div>
      <p style="color:var(--gold);font-size:.75rem;font-weight:700;text-transform:uppercase;letter-spacing:2px;margin-bottom:8px;">Kelas 7A · 2025/2026</p>
      <h1 style="font-family:'Playfair Display',serif;font-size:clamp(1.8rem,5vw,2.8rem);font-weight:900;">
        Daftar <span style="color:var(--gold)">Siswa</span>
      </h1>
      <p class="count-text" id="countText" style="margin-top:8px;">Memuat data...</p>
    </div>
    <div>
      <div class="search-bar">
        <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/>
        </svg>
        <input type="text" id="searchInput" placeholder="Cari nama siswa..." oninput="filterSiswa()">
      </div>
    </div>
  </div>

  <div style="padding:16px 40px 0;max-width:1140px;margin:0 auto;" id="filterRow">
    <div class="filter-row">
      <button class="chip active" onclick="setFilter('semua',this)">Semua</button>
      <button class="chip" onclick="setFilter('Laki-laki',this)">♂ Laki-laki</button>
      <button class="chip" onclick="setFilter('Perempuan',this)">♀ Perempuan</button>
    </div>
  </div>

  <div class="section">
    <div class="siswa-grid" id="siswaGrid">
      <div class="loading" style="grid-column:1/-1"><div class="spinner"></div>Memuat data siswa...</div>
    </div>
  </div>

</div>

<div id="toast"></div>

<script type="module">
import { db, ref, onValue, initNav } from '/_shared.js';
initNav();

let allData = {};
let activeFilter = 'semua';

onValue(ref(db,'kelas7a/siswa'), snap => {
  allData = snap.val() || {};
  renderSiswa();
});

window.setFilter = function(val, el) {
  activeFilter = val;
  document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
  el.classList.add('active');
  renderSiswa();
};

window.filterSiswa = function() { renderSiswa(); };

function renderSiswa() {
  const q = (document.getElementById('searchInput').value || '').toLowerCase();
  const grid = document.getElementById('siswaGrid');

  let entries = Object.entries(allData);
  if (activeFilter !== 'semua') entries = entries.filter(([,s]) => s.jk === activeFilter);
  if (q) entries = entries.filter(([,s]) => (s.nama||'').toLowerCase().includes(q));
  entries.sort((a,b) => (a[1].absen||999) - (b[1].absen||999));

  const total = Object.keys(allData).length;
  document.getElementById('countText').textContent =
    `Menampilkan ${entries.length} dari ${total} siswa`;

  if (!entries.length) {
    grid.innerHTML = `<div class="empty-state" style="grid-column:1/-1">
      <div class="icon">👤</div><p>Tidak ada siswa yang cocok</p></div>`;
    return;
  }

  grid.innerHTML = entries.map(([id,s]) => {
    const isL = s.jk !== 'Perempuan';
    const inisial = (s.nama||'?')[0].toUpperCase();
    const avatarInner = s.foto
      ? `<img src="${s.foto}" alt="${s.nama}" onerror="this.parentElement.innerHTML='${inisial}'">`
      : inisial;
    return `
    <div class="s-card">
      <div class="s-avatar ${isL?'lk':'pr'}">${avatarInner}</div>
      <div class="s-name">${s.nama||'Tidak diketahui'}</div>
      <div class="s-absen">No. Absen ${s.absen||'–'}</div>
      <div class="s-nis">NIS: ${s.nis||'–'}</div>
      <div class="s-jk">${isL?'♂':'♀'} ${s.jk||'–'}</div>
    </div>`;
  }).join('');
}
</script>
</body>
</html>
